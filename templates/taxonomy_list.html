{% extends "base.html" %}

{% block title %}{{ taxonomy.name }} &middot; {{ config.title }}{% endblock %}

{% block content %}
<h1>{{ taxonomy.name }}</h1>
<div class="tag-row">
  {% for term in terms %}
  <a class="tag" href="{{ term.permalink | safe }}">#{{ term.name }} ({{ term.pages | length }})</a>
  {% endfor %}
</div>
{% endblock %}
