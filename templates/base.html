<!DOCTYPE html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1e1e2e">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ get_url(path='giallo.css') | safe }}">
  <link rel="stylesheet" href="{{ get_url(path='style.css') | safe }}">
  {% if config.generate_feeds %}
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='feed.xml') | safe }}">
  {% endif %}
  {% block head %}{% endblock %}
</head>
<body>
  {% include "partials/header.html" %}

  <main>
    <div class="shell">
      {% block content %}{% endblock %}
    </div>
  </main>

  {% include "partials/footer.html" %}
</body>
</html>
